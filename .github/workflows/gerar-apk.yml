
name: Gerar APK - Chamado Rápido EC

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'saida/**'

permissions:
  contents: write

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Cordova
        run: npm install -g cordova@13.0.0

      - name: Instalar dependências
        run: npm install

      - name: Preparar leitor de QR Code local
        shell: bash
        run: |
          mkdir -p www/js
          QR_FILE=$(find node_modules/html5-qrcode -name 'html5-qrcode.min.js' -type f | head -n 1)
          test -n "$QR_FILE"
          cp "$QR_FILE" www/js/html5-qrcode.min.js

      - name: Recriar Android e plugins
        shell: bash
        run: |
          rm -rf platforms plugins
          cordova platform add android@15.1.0
          cordova prepare android

      - name: Gerar APK
        run: cordova build android --debug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p saida
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk saida/Chamado_Rapido_EC.apk
          ls -lh saida/Chamado_Rapido_EC.apk

      - name: Salvar APK na pasta saida da main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f saida/Chamado_Rapido_EC.apk
          git diff --cached --quiet || git commit -m "Atualizar APK do Chamado Rápido EC"
          git push

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chamado-Rapido-EC-APK
          path: saida/Chamado_Rapido_EC.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
